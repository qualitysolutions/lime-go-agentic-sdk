name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Type check (mypy --strict)
        run: mypy src/lime_go_agentic

      - name: Fetch Lime's OpenAPI spec (not redistributed in the repo)
        run: python scripts/fetch_spec.py

      - name: Unit + spec-conformance tests
        # Integration tests are excluded by default (addopts -m 'not integration');
        # they need live LIME_GO_* credentials and are not run in CI.
        env:
          LIME_SPEC_REQUIRED: "1"
        run: pytest -q
