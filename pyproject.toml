[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qls-lime-go-agentic"
version = "26.10.14"
description = "Python SDK for the Lime Go Agentic public CRM API (JSON:API, OAuth2 client credentials)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "QLS quality solutions AB" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.urls]
Repository = "https://github.com/qualitysolutions/lime-go-agentic-sdk"
Changelog = "https://github.com/qualitysolutions/lime-go-agentic-sdk/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lime_go_agentic"]

[tool.hatch.build.targets.sdist]
exclude = [".env", ".venv", "dist", "spec"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Integration tests hit the live API and require LIME_GO_* credentials; excluded by
# default. Run them with:  pytest -m integration
addopts = "-m 'not integration'"
markers = [
    "integration: live API tests requiring LIME_GO_* credentials (skipped by default)",
]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
# Type-check model constructors (field types, enums, unknown fields) for SDK callers.
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true
